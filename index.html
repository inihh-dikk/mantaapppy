<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090f">
<title>Hiihuuu 😈</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at top,#27204b,#09090f 62%);color:white;font-family:Arial,sans-serif;text-align:center;padding:24px}
.card{width:min(100%,420px);padding:32px 24px;border:1px solid #ffffff25;border-radius:28px;background:#ffffff0d;box-shadow:0 20px 70px #0008}
.emoji{font-size:64px;animation:bounce 1.1s infinite}h1{font-size:clamp(34px,10vw,54px);margin:16px 0 8px;letter-spacing:2px}p{color:#c9c6d9;line-height:1.6}
button{margin-top:18px;border:0;border-radius:999px;padding:16px 26px;background:#a78bfa;color:#160d2b;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 28px #8b5cf666}
button:active{transform:scale(.97)}.small{font-size:12px;color:#8f8ba2;margin-top:24px}
@keyframes bounce{50%{transform:translateY(-12px) rotate(8deg)}}
</style>
</head>
<body>
<main class="card">
 <div class="emoji">👀</div>
 <h1>HIII...</h1>
 <p>Selamat! Kamu berhasil membuka sesuatu yang sangat penting.</p>
 <button id="play">BUKA KEJUTANNYA ✨</button>
 <p id="message" aria-live="polite"></p>
 <div class="small">jangan kaget yaa 😭</div>
 <audio id="sound" preload="auto" src="suara-video.mp3"></audio>
</main>
<script>
const btn=document.getElementById('play'), audio=document.getElementById('sound');
btn.addEventListener('click',async()=>{
  document.getElementById('message').textContent='HIihuuu!!! 🤣🤣';
  btn.textContent='PUTAR LAGI 🔁';
  try{audio.currentTime=0; await audio.play();}
  catch(e){document.getElementById('message').textContent='Hiihuuu!!! 🤣 (ketuk tombol sekali lagi untuk suara)';}
});
</script>
</body></html>
