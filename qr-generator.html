<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembuat QR Hiihuuu</title>
<style>body{font:16px Arial;background:#10101a;color:white;display:grid;place-items:center;min-height:100vh;padding:20px}main{max-width:440px;text-align:center;background:#222236;padding:24px;border-radius:20px}input{width:100%;padding:13px;border-radius:10px;border:0;margin:12px 0}button{padding:12px 20px;border:0;border-radius:10px;background:#a78bfa;font-weight:bold}#qrcode{background:white;padding:14px;margin:20px auto;width:max-content}</style>
<main><h2>QR Code Hiihuuu 😈</h2><p>Tempel URL website yang sudah kamu publish, lalu buat QR-nya.</p><input id="url" type="url" placeholder="https://website-kamu.com"><br><button onclick="makeQR()">BUAT QR CODE</button><div id="qrcode"></div><p>Scan QR ini dengan kamera HP untuk membuka prank.</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>function makeQR(){let u=document.getElementById('url').value.trim(),q=document.getElementById('qrcode');q.innerHTML='';if(!/^https?:\\/\\//i.test(u)){alert('Masukkan URL website yang sudah online (https://...)');return;}new QRCode(q,{text:u,width:220,height:220,correctLevel:QRCode.CorrectLevel.H});}</script></html>
